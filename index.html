<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitshape | Administração</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#17251c;background:#f5f7f2}*{box-sizing:border-box}body{margin:0}header{background:#12251b;color:white;padding:24px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:24px}header span{color:#b9d9a8;font-size:13px}main{max-width:1160px;margin:30px auto;padding:0 20px}.hero{background:#ddf2d1;padding:25px;border-radius:18px;margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#435648}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,.button{background:#21853b;border:0;border-radius:10px;color:white;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer}button.secondary{color:#193222;background:#e7eee5}button:disabled{opacity:.5;cursor:wait}nav button.active{background:#12251b}.card{background:white;border:1px solid #e1e7dd;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 7px 28px #17251c0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;color:#435648}input,select,textarea{display:block;width:100%;margin-top:7px;border:1px solid #c7d4c4;border-radius:9px;background:white;padding:11px;font:inherit;color:#17251c}input[type=checkbox]{width:auto;display:inline;margin-right:9px}form button{margin-top:17px}.muted{color:#68796a;font-size:14px}.pill{display:inline-block;border-radius:999px;background:#e5f3db;padding:5px 9px;font-size:12px;font-weight:700}.error{background:#fff0e9;color:#9d3219;padding:15px;border-radius:12px}.success{background:#e6f4e8;color:#14632a;padding:15px;border-radius:12px}#notice:empty{display:none}.search{max-width:480px}.product{display:grid;grid-template-columns:70px 1fr;gap:15px;align-items:start}.product img{width:70px;height:70px;object-fit:contain;background:#f8faf6;border-radius:9px}.product h3{margin:0 0 4px}.product small{color:#657369}.variant{border-top:1px solid #eef0ec;margin-top:14px;padding-top:14px}h2{margin:0 0 12px}p{line-height:1.5}@media(max-width:600px){header{padding:20px}.product{grid-template-columns:50px 1fr}.product img{width:50px;height:50px}}
</style>
<header><div><strong>FITSHAPE</strong><br><span>Painel de administração</span></div><a class="button" href="https://fitshape-suplementos.vercel.app/" target="_blank" rel="noopener">Ver loja ↗</a></header>
<main><section class="hero"><h1>Controle sua loja</h1><p>Edite preços e estoque, programe ofertas e acompanhe os pedidos em um só lugar.</p></section><div id="notice" role="status"></div><nav><button class="active" data-tab="produtos">Produtos</button><button class="secondary" data-tab="campanhas">Promoções</button><button class="secondary" data-tab="pedidos">Pedidos</button><button class="secondary" data-tab="fretes">Fretes</button><button class="secondary" data-tab="financeiro">Financeiro</button></nav><div id="content"><p>Carregando catálogo…</p></div></main>
<script>
const $=s=>document.querySelector(s), content=$('#content');let catalog=null,campaigns=[],orders=[],tab='produtos';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'A definir':(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=v=>Math.round(Number(String(v).replace(',','.'))*100);
const say=(msg,error=false)=>{$('#notice').innerHTML=`<p class="${error?'error':'success'}">${esc(msg)}</p>`;window.scrollTo({top:0,behavior:'smooth'})};
async function api(action,method='GET',data,id){const response=await fetch('/api/admin?action='+action+(id?'&id='+encodeURIComponent(id):''),{method,headers:method==='GET'?{}:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});let result;try{result=await response.json()}catch{throw Error('A resposta da loja não pôde ser lida.')}if(!response.ok)throw Error(result.error||'Não foi possível salvar.');return result}
function options(selected){return catalog.products.flatMap(p=>p.variants.map(v=>`<option value="${esc(v.sku)}" ${selected===v.sku?'selected':''}>${esc(p.name)} · ${esc(v.label||v.sku)} (${esc(v.sku)})</option>`)).join('')}
function productView(){const q=$('#search')?.value.toLowerCase()||'';content.innerHTML=`<div class="card"><h2>Produtos e estoque</h2><p class="muted">Busque pelo nome ou SKU. Alterações salvas aparecem na vitrine.</p><input id="search" class="search" placeholder="Buscar produto ou SKU" value="${esc(q)}"></div><div id="list"></div>`;$('#search').oninput=productList;productList()}
function productList(){const q=$('#search').value.toLowerCase();let products=catalog.products.filter(p=>(p.name+' '+p.brand+' '+p.variants.map(v=>v.sku).join(' ')).toLowerCase().includes(q));$('#list').innerHTML=products.slice(0,40).map(p=>`<div class="card product"><img src="${esc(p.image?.startsWith('/')?'https://fitshape-suplementos.gmsosdigital.chatgpt.site'+p.image:(p.image||p.imageUrl||''))}" alt=""><div><h3>${esc(p.name)}</h3><small>${esc(p.brand||'')} · ${p.variants.length} apresentação(ões)</small>${p.variants.map(v=>`<form class="variant" data-sku="${esc(v.sku)}"><strong>${esc(v.label||v.sku)}</strong> <span class="pill">${esc(v.sku)}</span><div class="grid" style="margin-top:12px"><label>Preço (R$)<input name="price" inputmode="decimal" value="${v.originalPriceCents!=null?(v.originalPriceCents/100).toFixed(2):v.retailPriceCents!=null?(v.retailPriceCents/100).toFixed(2):''}" placeholder="Ex.: 99,90" required></label><label>Estoque disponível<input name="stock" type="number" min="0" step="1" value="${v.stockQuantity??''}" placeholder="Ex.: 10" required></label><label>Peso da embalagem (g)<input name="weight" type="number" min="1" step="1" value="${v.packageWeightGrams??''}" placeholder="Opcional"></label></div><button>Salvar alterações</button></form>`).join('')}</div></div>`).join('')||'<p>Nenhum produto encontrado.</p>';$('#list').querySelectorAll('form').forEach(f=>f.onsubmit=saveProduct)}
async function saveProduct(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),sku=f.dataset.sku,existing=catalog.products.flatMap(p=>p.variants).find(v=>v.sku===sku);const price=cents(f.elements.namedItem('price').value),stock=Number(f.elements.namedItem('stock').value),weight=f.elements.namedItem('weight').value?Number(f.elements.namedItem('weight').value):null;if(!existing||!Number.isInteger(price)||price<1||!Number.isInteger(stock)||stock<0){say('Confira preço e estoque.',true);return}b.disabled=true;try{await api('inventory','PUT',{sku,values:{retailPriceCents:price,stockQuantity:stock,packageWeightGrams:weight,gtin:existing.gtin??null,dimensionsCm:existing.dimensionsCm??null}});say('Produto salvo. A vitrine foi atualizada.');catalog=await api('catalog')}catch(err){say(err.message,true)}finally{b.disabled=false}}
function campaignsView(){const ids=[['segunda','Segunda-feira'],['quarta','Quarta-feira'],['fim-semana','Fim de semana']];content.innerHTML=`<div class="card"><h2>Ofertas programadas</h2><p class="muted">A oferta entra na vitrine apenas no período e nos dias definidos, com estoque disponível. Cadastre preço e estoque do produto primeiro.</p></div>`+ids.map(([id,label])=>{const c=campaigns.find(x=>x.id===id)||{};return `<form class="card" data-campaign="${id}"><h2>${label}</h2><div class="grid"><label>Título<input name="title" maxlength="70" value="${esc(c.title||'Oferta '+label)}" required></label><label>Produto<select name="sku">${options(c.sku)}</select></label><label>Preço promocional (R$)<input name="price" inputmode="decimal" value="${c.price?(c.price/100).toFixed(2):''}" required></label><label>Início<input name="start" type="date" value="${esc(c.start||'')}" required></label><label>Fim<input name="end" type="date" value="${esc(c.end||'')}" required></label></div><p><label><input name="enabled" type="checkbox" ${c.enabled?'checked':''}> Ativar quando chegar a data</label></p><button>Salvar promoção</button></form>`}).join('');content.querySelectorAll('form').forEach(f=>f.onsubmit=saveCampaign)}
async function saveCampaign(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await api('campaigns','PUT',{id:f.dataset.campaign,title:f.elements.namedItem('title').value,sku:f.elements.namedItem('sku').value,price:cents(f.elements.namedItem('price').value),start:f.elements.namedItem('start').value,end:f.elements.namedItem('end').value,enabled:f.elements.namedItem('enabled').checked});campaigns=await api('campaigns');say('Promoção salva.');campaignsView()}catch(err){say(err.message,true)}finally{b.disabled=false}}
const statuses={received:'Recebido',awaiting_payment:'Aguardando pagamento',paid:'Pago',shipped:'Enviado',delivered:'Entregue',cancelled:'Cancelado'};
const next={received:['awaiting_payment','cancelled'],awaiting_payment:['paid','cancelled'],paid:['shipped'],shipped:['delivered']};
function ordersView(){content.innerHTML=`<div class="card"><h2>Pedidos registrados</h2><p class="muted">Os pedidos finalizados somente pelo WhatsApp ainda não aparecem aqui automaticamente.</p></div>`+(orders.map(o=>`<div class="card"><h2>${esc(o.id)} <span class="pill">${esc(statuses[o.status]||o.status)}</span></h2><p>${esc(o.name||'Cliente')} · ${esc(o.neighborhood||'')} · ${esc(o.city||'')} / ${esc(o.state||'')}</p><p>${o.items?.map(i=>`${esc(i.qty)} × ${esc(i.name||i.sku)}`).join('<br>')||''}</p><p>Produtos: <strong>${money(o.subtotal)}</strong> · Frete: <strong>${money(o.shipping)}</strong> · ${esc(o.payment||'')}</p><form data-order="${esc(o.id)}"><div class="grid"><label>Próxima etapa<select name="status">${(next[o.status]||[]).map(s=>`<option value="${s}">${statuses[s]}</option>`).join('')}</select></label><label>Frete combinado (R$)<input name="shipping" inputmode="decimal" value="${o.shipping!=null?(o.shipping/100).toFixed(2):''}" placeholder="Antes de aguardar pagamento"></label><label>Rastreamento<input name="tracking" value="${esc(o.tracking||'')}" placeholder="Opcional"></label></div>${next[o.status]?.length?'<button>Atualizar pedido</button>':''}</form></div>`).join('')||'<div class="card">Nenhum pedido registrado ainda.</div>');content.querySelectorAll('form').forEach(f=>f.onsubmit=saveOrder)}
async function saveOrder(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await api('order','PATCH',{status:f.elements.namedItem('status').value,shipping:f.elements.namedItem('shipping').value?cents(f.elements.namedItem('shipping').value):null,tracking:f.elements.namedItem('tracking').value},f.dataset.order);orders=await api('orders');say('Pedido atualizado.');ordersView()}catch(err){say(err.message,true)}finally{b.disabled=false}}

function shippingView(){content.innerHTML=`<form class="card" id="shipping-form"><h2>Entrega por bairro · Jaraguá do Sul</h2><p>Uma linha por bairro: <strong>Bairro; valor em reais; prazo</strong>. Cadastre somente valores combinados com o motoboy. Use 0 para frete grátis.</p><label>Tabela de fretes<textarea name="rates" rows="10" placeholder="Bairro; valor; prazo">${esc((catalog.store.delivery.rates||[]).map(r=>r.neighborhood+'; '+(r.price/100).toFixed(2).replace('.',',')+'; '+r.eta).join('\n'))}</textarea></label><p class="muted">Bairros sem valor e outras cidades continuam sob cotação. Salvar substitui a tabela anterior. A loja e os próximos pedidos usam os novos valores.</p><button>Salvar fretes</button></form>`;$('#shipping-form').onsubmit=saveShipping}
async function saveShipping(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');try{const text=f.elements.namedItem('rates').value.trim();const rates=text?text.split(/\n/).filter(l=>l.trim()).map((line,i)=>{const [name,value,...eta]=line.split(';');const n=Number(value?.trim().replace(',','.'));if(!value?.trim()||!Number.isFinite(n)||n<0||Math.abs(n*100-Math.round(n*100))>.001)throw Error('Confira o valor na linha '+(i+1));return {neighborhood:name.trim(),price:Math.round(n*100),eta:eta.join(';').trim()}}):[];b.disabled=true;await api('shipping','PUT',{rates});catalog=await api('catalog');say('Fretes atualizados na loja.');shippingView()}catch(err){say(err.message,true)}finally{b.disabled=false}}

async function show(){try{if(tab==='produtos'){catalog=await api('catalog');productView()}else if(tab==='campanhas'){catalog=await api('catalog');campaigns=await api('campaigns');campaignsView()}else if(tab==='financeiro'){catalog=await api('catalog');await financeView()}else if(tab==='fretes'){catalog=await api('catalog');shippingView()}else{orders=await api('orders');ordersView()}}catch(err){content.innerHTML=`<div class="card error"><h2>Não foi possível abrir o painel</h2><p>${esc(err.message)}</p></div>`}}
let finance=null,financeMonth=new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}).slice(0,7);
const localDate=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
async function financeView(){content.innerHTML='<div class="card">Carregando financeiro…</div>';await api('finance','POST',{op:'sync'});finance=await api('finance&month='+financeMonth);drawFinance();}
function drawFinance(){const t=finance.totals;content.innerHTML=`<div class="card"><h2>Financeiro simples</h2><label style="max-width:210px">Mês<input id="finance-month" type="month" value="${esc(financeMonth)}"></label><p class="muted">Vendas concluídas e gastos da operação. Pedidos pagos do site são importados ao abrir esta aba, sem duplicar. WhatsApp: registre a venda aqui. Este controle não altera o estoque.</p><div class="grid">${[['Vendas',money(t.revenue)],['Custos + gastos',money(t.cost+t.expenses)],['Lucro gerencial',money(t.profit)],['Margem',t.margin===null?'—':(t.margin*100).toFixed(1)+'%'],['Gustavo · 60%',t.pending?'Revisar custos':money(t.gustavo)],['Marcelo · 40%',t.pending?'Revisar custos':money(t.marcelo)]].map(([k,v])=>`<div><span class="muted">${k}</span><h2>${esc(v)}</h2></div>`).join('')}</div>${t.pending?`<p class="error">${t.pending} venda(s) precisam de revisão de custos e taxas. O lucro exibido é provisório.</p>`:''}<p class="muted">Frete, embalagem e demais despesas por venda entram em custos extras. Não é saldo de caixa; retiradas dos sócios não são gastos.</p></div>
<form class="card" id="finance-sale"><h2>Registrar venda concluída</h2><div class="grid"><label>Produto<select name="sku">${options()}</select></label><label>Quantidade<input name="qty" type="number" min="1" max="9999" value="1" required></label><label>Valor vendido por unidade (R$)<input name="unitPrice" inputmode="decimal" required></label></div><details style="margin-top:15px"><summary>Canal, custo e data</summary><div class="grid"><label>Canal<select name="channel">${['WhatsApp','Loja','Site','Mercado Livre','Shopee','TikTok Shop'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Custo por unidade (R$)<input name="unitCost" inputmode="decimal" required></label><label>Custos extras da venda (R$)<input name="extra" value="0" inputmode="decimal" required></label><label>Data<input name="date" type="date" value="${localDate()}" required></label></div></details><p class="muted" id="finance-rate-note"></p><button>Salvar venda</button></form>
<form class="card" id="finance-expense"><h2>Registrar gasto</h2><div class="grid"><label>Descrição<input name="description" placeholder="Ex.: anúncio da live" maxlength="120" required></label><label>Valor (R$)<input name="amount" inputmode="decimal" required></label></div><details><summary>Data</summary><input name="date" type="date" value="${localDate()}" required></details><p class="muted">Não lance compras de estoque nem custos já incluídos na venda.</p><button>Salvar gasto</button></form>
<details class="card"><summary>Taxas por canal · configurar uma vez</summary><form id="finance-settings"><div class="grid"><label>Canal<select name="channel">${['WhatsApp','Loja','Site','Mercado Livre','Shopee','TikTok Shop'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Taxa de pagamento/plataforma (%)<input name="fee" type="number" min="0" max="99" step="0.01" required></label><label>Impostos (%)<input name="tax" type="number" min="0" max="99" step="0.01" required></label><label>Comissão (%)<input name="commission" type="number" min="0" max="99" step="0.01" required></label></div><p class="muted">Informe 0 se não houver. Percentuais sobre o valor dos produtos. Valem para novos lançamentos; o histórico mantém os valores salvos.</p><button>Salvar taxas</button></form></details>
<div class="card"><h2>Lançamentos do mês</h2>${finance.entries.length?finance.entries.map(e=>`<div class="variant" style="opacity:${e.void?'.5':'1'}"><strong>${esc(e.description)}</strong><p>${esc(e.date)} · ${e.type==='expense'?'Gasto':esc(e.channel)} · ${e.void?'Desconsiderado':e.type==='expense'?money(e.amount):'Venda '+money(e.revenue)+' · Resultado '+money(e.revenue-e.cost-e.fees-e.extra)}</p>${e.type==='sale'&&!e.void?`<details><summary>${e.reviewed?'Editar custos':'Revisar custos para fechar o lucro'}</summary><form class="finance-review" data-id="${esc(e.id)}"><div class="grid"><label>Custo total dos produtos<input name="cost" value="${(e.cost/100).toFixed(2)}" required></label><label>Total de taxas, impostos e comissões<input name="fees" value="${(e.fees/100).toFixed(2)}" required></label><label>Frete pago, embalagem e outros custos<input name="extra" value="${(e.extra/100).toFixed(2)}" required></label><label>Data da venda<input name="date" type="date" value="${esc(e.date)}" required></label></div><p class="muted">Pedidos antigos usam o custo atual como referência e a data de criação. Confirme os valores e a data antes de salvar.</p><button>Confirmar custos</button></form></details>`:''}<button class="secondary finance-void" data-id="${esc(e.id)}" data-void="${!e.void}">${e.void?'Restaurar':'Desconsiderar'}</button></div>`).join(''):'Nenhum lançamento neste mês.'}</div>`;
$('#finance-month').onchange=e=>{financeMonth=e.target.value;financeView().catch(e=>say(e.message,true));};
const sale=$('#finance-sale');sale.dataset.key=crypto.randomUUID();const product=()=>{const v=catalog.products.flatMap(p=>p.variants).find(v=>v.sku===sale.elements.sku.value);sale.elements.unitPrice.value=(v.retailPriceCents/100).toFixed(2);sale.elements.unitCost.value=(v.referencePriceCents/100).toFixed(2);};product();sale.elements.sku.onchange=product;const rateNote=()=>{const r=finance.settings.channels[sale.elements.channel.value];$('#finance-rate-note').textContent=r?'Taxas salvas: '+(r.fee+r.tax+r.commission)+'% sobre os produtos.':'Configure as taxas deste canal ou revise os custos após salvar. O lucro ficará provisório.';};rateNote();sale.elements.channel.onchange=rateNote;
sale.onsubmit=e=>financeSubmit(e,{op:'sale',id:sale.dataset.key,sku:sale.elements.sku.value,qty:Number(sale.elements.qty.value),unitPrice:cents(sale.elements.unitPrice.value),unitCost:cents(sale.elements.unitCost.value),extra:cents(sale.elements.extra.value),channel:sale.elements.channel.value,date:sale.elements.date.value});
const expense=$('#finance-expense');expense.dataset.key=crypto.randomUUID();expense.onsubmit=e=>financeSubmit(e,{op:'expense',id:expense.dataset.key,description:expense.elements.description.value,amount:cents(expense.elements.amount.value),date:expense.elements.date.value});
const settings=$('#finance-settings');const fill=()=>{const r=finance.settings.channels[settings.elements.channel.value];for(const k of ['fee','tax','commission'])settings.elements[k].value=r?.[k]??'';};fill();settings.elements.channel.onchange=fill;settings.onsubmit=e=>financeSubmit(e,{op:'settings',channel:settings.elements.channel.value,fee:Number(settings.elements.fee.value),tax:Number(settings.elements.tax.value),commission:Number(settings.elements.commission.value)});
content.querySelectorAll('.finance-review').forEach(f=>f.onsubmit=e=>financeSubmit(e,{op:'review',id:f.dataset.id,cost:cents(f.elements.cost.value),fees:cents(f.elements.fees.value),extra:cents(f.elements.extra.value),date:f.elements.date.value}));content.querySelectorAll('.finance-void').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('finance','POST',{op:'void',id:b.dataset.id,void:b.dataset.void==='true'});await financeView()}catch(e){say(e.message,true);b.disabled=false;}});
}
async function financeSubmit(e,data){e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{await api('finance','POST',data);say('Salvo no financeiro.');await financeView()}catch(err){say(err.message,true);button.disabled=false;}}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>{x.className=x===b?'active':'secondary'});show()});show();
</script></html>
